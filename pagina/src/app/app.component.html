<header class="navbar">
  <div class="navbar__content">
    <div class="navbar__left">
      <span class="navbar__separator" aria-hidden="true"></span>
      <span class="navbar__brand">{{ i18n.t('app.title') }}</span>
    </div>

    <button
      type="button"
      class="navbar__menu-button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="i18n.t('nav.menu')"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="navbar__tabs" [class.navbar__tabs--open]="menuOpen">
      <a
        routerLink="/"
        routerLinkActive="tab--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="tab"
        (click)="closeMenu()"
      >
        {{ i18n.t('nav.home') }}
      </a>

      <a
        routerLink="/simulador"
        routerLinkActive="tab--active"
        class="tab"
        (click)="closeMenu()"
      >
        {{ i18n.t('nav.simulator') }}
      </a>

      <a
        routerLink="/acerca"
        routerLinkActive="tab--active"
        class="tab"
        (click)="closeMenu()"
      >
        {{ i18n.t('nav.about') }}
      </a>      

      <a
        routerLink="/descripcion"
        routerLinkActive="tab--active"
        class="tab"
        (click)="closeMenu()"
      >
        {{ i18n.t('nav.description') }}
      </a>

      <div class="language-select-wrapper">
        <span class="language-select-icon" aria-hidden="true">🌐</span>

        <select
          class="language-select"
          [(ngModel)]="selectedLanguage"
          aria-label="Language selector"
        >
          @for (language of i18n.languages; track language.code) {
            <option [value]="language.code">
              {{ language.label }}
            </option>
          }
        </select>
      </div>
    </nav>
  </div>
</header>

<main class="page">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  © 2025 {{ i18n.t('footer.rights') }}
</footer>
